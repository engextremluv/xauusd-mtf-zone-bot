[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-mtf-zone-bot"
version = "0.1.0"
description = "Multi-timeframe candle-zone backtesting engine for XAUUSD (spec-driven, MT5-oriented)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "dukascopy-python>=4.0.0",
    "pyarrow>=14.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
xauusd-bot = "xauusd_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
